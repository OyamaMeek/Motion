<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會呼吸的痛 · 分鏡</title>
<style>
  html,body { margin:0; background:#eee8d9; overflow:hidden; }
  canvas { display:block; width:100vw!important; height:auto!important; }
</style>
<body>
<script>
  window.renderErrors = [];
  window.addEventListener('error', e => renderErrors.push(e.message));
  window.addEventListener('unhandledrejection', e => renderErrors.push(String(e.reason)));
</script>
<script type="module">
  import {frameAt} from './film.js';
  import {createPixel} from './pixel.js';
  import {SHOTS} from './shots.js';

  const art = createPixel();
  window.art = art;
  window.shotList = SHOTS;
  window.renderAt = t => art.render(frameAt(t));
  window.artReady = true;
</script>
</html>
